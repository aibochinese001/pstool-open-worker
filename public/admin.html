<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>广告管理后台 - 图像编辑器</title>
	<meta name="robots" content="noindex, nofollow" />
	<link rel="icon" sizes="192x192" href="images/manifest/icon-192x192.png">
	<style>
		:root {
			--brand: #2b5cff; --brand2: #8a3ffc;
			--grad: linear-gradient(135deg, #2b5cff 0%, #8a3ffc 100%);
			--ink: #1c2333; --ink-soft: #5a6478; --line: #e6e9f2;
			--bg: #f3f5fb; --card: #fff; --danger: #e5484d; --ok: #2f9e6e;
			--radius: 14px;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
			background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
		}
		.wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }
		.topbar { background: #1c2333; color: #fff; }
		.topbar-inner { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
		.topbar img { width: 26px; height: 26px; border-radius: 7px; }
		.topbar b { font-size: 15px; }
		.topbar .tag { font-size: 12px; background: rgba(255,255,255,.14); padding: 3px 10px; border-radius: 999px; }
		.topbar a { margin-left: auto; color: #c6cdea; font-size: 13px; text-decoration: none; }
		.topbar a:hover { color: #fff; }

		.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-top: 20px; box-shadow: 0 6px 18px rgba(28,35,51,.05); }
		.card h2 { font-size: 16px; margin-bottom: 14px; }
		.muted { color: var(--ink-soft); font-size: 13px; }

		label.field { display: block; margin-bottom: 12px; }
		label.field span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
		input[type=text], input[type=password], textarea {
			width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit;
			transition: border-color .15s; background: #fbfcff;
		}
		input:focus, textarea:focus { outline: none; border-color: #9fb2f5; background: #fff; }
		textarea { min-height: 96px; font-family: Consolas, Monaco, monospace; font-size: 12.5px; }

		.btn { display: inline-flex; align-items: center; gap: 7px; border: 0; cursor: pointer; font-size: 14px; font-weight: 600;
			padding: 10px 22px; border-radius: 10px; transition: transform .12s, opacity .12s; }
		.btn:active { transform: scale(.97); }
		.btn.primary { background: var(--grad); color: #fff; }
		.btn.primary:disabled { opacity: .55; cursor: wait; }
		.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
		.btn.danger { background: #fdeced; color: var(--danger); }
		.btn.sm { padding: 6px 13px; font-size: 12.5px; border-radius: 8px; }

		/* 登录 */
		#gate { max-width: 380px; margin: 80px auto 0; text-align: center; }
		#gate h1 { font-size: 20px; margin-bottom: 6px; }
		#gate .muted { margin-bottom: 18px; }
		#gate input { text-align: center; margin-bottom: 14px; }
		#gate-msg { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 10px; }

		/* 广告列表 */
		.ad-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line); }
		.ad-row:first-of-type { border-top: 0; }
		.ad-row.dragging { opacity: .35; }
		.ad-handle { cursor: grab; color: #b6bfd8; font-size: 15px; padding: 6px 4px; user-select: none; flex: none; line-height: 1; border-radius: 6px; }
		.ad-handle:hover { color: var(--brand); background: #eef1fa; }
		.ad-thumb { width: 74px; height: 48px; border-radius: 8px; object-fit: cover; background: #eef1fa; flex: none; }
		.ad-thumb.code { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--brand); font-weight: 700; }
		.ad-info { min-width: 0; flex: 1; }
		.ad-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
		.ad-link { color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.state { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
		.state.on { background: #e7f6ef; color: var(--ok); }
		.state.off { background: #f1f2f7; color: var(--ink-soft); }
		.ad-actions { display: flex; gap: 8px; flex: none; }

		.type-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
		.type-tabs button { border: 1.5px solid var(--line); background: #fff; padding: 8px 18px; border-radius: 999px; font-size: 13.5px; cursor: pointer; font-weight: 600; color: var(--ink-soft); }
		.type-tabs button.on { border-color: transparent; background: var(--grad); color: #fff; }

		#msg { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #1c2333; color: #fff;
			font-size: 13.5px; padding: 10px 20px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 99; max-width: 86vw; }
		#msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
		#msg.err { background: var(--danger); }
		.preview-img { max-width: 220px; max-height: 100px; margin-top: 6px; border-radius: 8px; border: 1px solid var(--line); display: none; }

		/* 访问统计 */
		.stat-tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
		.tile { background: #f8f9ff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
		.tile .t-num { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
		.tile .t-label { font-size: 12px; color: var(--ink-soft); }
		.chart { display: flex; align-items: stretch; gap: 5px; height: 150px; margin-top: 10px; padding: 14px 4px 0; }
		.chart .day-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
		.chart .bars { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
		.chart .bar { width: 42%; max-width: 18px; background: var(--grad); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; cursor: default; }
		.chart .bar.uv { background: #c3cdf2; }
		.chart .bar:hover::after { content: attr(data-v); position: absolute; top: -24px; left: 50%; transform: translateX(-50%); background: #1c2333; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; z-index: 5; }
		.chart .day-label { font-size: 10px; color: var(--ink-soft); text-align: center; margin-top: 5px; white-space: nowrap; overflow: hidden; }
		.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
		.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
		.stat-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
		.stat-cols h3, .sub-title { font-size: 13.5px; margin: 14px 0 8px; }
		.hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13px; }
		.hbar-row .h-label { width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); flex: none; }
		.hbar-row .h-track { flex: 1; background: #eef1fa; border-radius: 999px; height: 10px; overflow: hidden; }
		.hbar-row .h-fill { display: block; height: 100%; background: var(--grad); border-radius: 999px; }
		.hbar-row .h-val { width: 56px; text-align: right; font-weight: 600; font-size: 12.5px; flex: none; }
		@media (max-width: 720px) {
			.stat-tiles { grid-template-columns: repeat(3, 1fr); }
			.stat-cols { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>

	<header class="topbar">
		<div class="topbar-inner">
			<img src="images/manifest/icon-64x64.png" alt="" />
			<b>图像编辑器</b>
			<span class="tag">广告管理后台</span>
			<a href="/">← 返回首页</a>
		</div>
	</header>

	<div class="wrap">
		<!-- 登录 -->
		<div class="card" id="gate">
			<h1>🔐 广告管理后台</h1>
			<p class="muted">请输入管理密码登录</p>
			<input type="password" id="pw" placeholder="管理密码" autocomplete="current-password" />
			<button class="btn primary" id="btn-login" type="button">登 录</button>
			<div id="gate-msg"></div>
		</div>

		<!-- 管理面板 -->
		<div id="panel" hidden>
			<div class="card">
				<h2>📈 访问统计
					<button class="btn ghost sm" id="btn-stats-refresh" type="button" style="margin-left: 10px; vertical-align: 1px;">刷新</button>
				</h2>
				<div class="stat-tiles" id="stat-tiles"><p class="muted">加载中…</p></div>
				<h3 class="sub-title">近 14 天访问趋势</h3>
				<div class="chart" id="trend-chart"></div>
				<div class="legend">
					<span><i style="background: var(--grad);"></i>浏览量 PV</span>
					<span><i style="background: #c3cdf2;"></i>访客数 UV</span>
				</div>
				<div class="stat-cols">
					<div>
						<h3>页面浏览分布（近 30 天）</h3>
						<div id="stat-pages"><p class="muted">加载中…</p></div>
					</div>
					<div>
						<h3>外部来源 TOP（近 30 天）</h3>
						<div id="stat-refs"><p class="muted">加载中…</p></div>
					</div>
				</div>
				<h3 class="sub-title">设备分布（近 30 天）</h3>
				<div id="stat-devices" style="max-width: 420px;"><p class="muted">加载中…</p></div>
			</div>

			<div class="card">
				<h2>广告列表 <span class="muted" style="font-weight:400;font-size:12px">（拖动 ⠿ 可调整顺序，顺序即前端轮播顺序）</span></h2>
				<div id="ad-list"><p class="muted">加载中…</p></div>
			</div>

			<div class="card" id="add-card">
				<h2 id="form-title">添加广告</h2>
				<div class="type-tabs">
					<button type="button" id="tab-image" class="on">🖼️ 图片广告</button>
					<button type="button" id="tab-code">📜 广告代码（Google AdSense）</button>
				</div>

				<label class="field">
					<span>广告名称 <em class="muted" style="font-weight:400">（仅用于管理识别，图片广告会显示为角标）</em></span>
					<input type="text" id="f-name" maxlength="100" placeholder="例如：618 促销活动" />
				</label>

				<div id="fields-image">
					<label class="field">
						<span>图片（直接上传文件，或填写图片 URL）</span>
						<input type="text" id="f-image" placeholder="https://your-cdn.com/banner.png" />
						<img class="preview-img" id="img-preview" alt="图片预览" />
					</label>
					<div style="margin: -4px 0 12px;">
						<input type="file" id="f-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
						<button class="btn ghost sm" id="btn-upload" type="button">📁 上传图片文件</button>
						<span class="muted" id="upload-hint">支持 PNG / JPEG / WebP / GIF，大图自动压缩，不超过 5MB</span>
					</div>
					<label class="field">
						<span>点击跳转链接 <em class="muted" style="font-weight:400">（新标签页打开，可留空）</em></span>
						<input type="text" id="f-link" placeholder="https://example.com/landing" />
					</label>
				</div>

				<div id="fields-code" hidden>
					<label class="field">
						<span>广告单元代码 <em class="muted" style="font-weight:400">（直接粘贴 Google AdSense 等平台提供的完整代码）</em></span>
						<textarea id="f-html" placeholder='<ins class="adsbygoogle" ...></ins>\n<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>'></textarea>
					</label>
				</div>

				<button class="btn primary" id="btn-add" type="button">添加广告</button>
				<button class="btn ghost" id="btn-cancel-edit" type="button" hidden>取消编辑</button>
				<p class="muted" style="margin-top:10px">提示：广告在前端广告位每 10 秒自动轮播；图片广告将以新标签页打开跳转链接。</p>
			</div>
		</div>
	</div>

	<div id="msg"></div>

	<script>
		(function () {
			'use strict';
			var PW_KEY = 'pstool-admin-pw';
			var $ = function (id) { return document.getElementById(id); };
			var token = localStorage.getItem(PW_KEY) || '';

			var adType = 'image';

			function toast(text, isErr) {
				var el = $('msg');
				el.textContent = text;
				el.className = 'show' + (isErr ? ' err' : '');
				clearTimeout(el._t);
				el._t = setTimeout(function () { el.className = ''; }, 2600);
			}

			function authHeaders() {
				return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
			}

			function logout() {
				localStorage.removeItem(PW_KEY);
				token = '';
				$('panel').hidden = true;
				$('gate').hidden = false;
			}

			function esc(s) {
				return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
					return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
				});
			}

			function renderList(ads) {
				var box = $('ad-list');
				if (!ads.length) {
					box.innerHTML = '<p class="muted">还没有广告，使用下方表单添加第一条广告。</p>';
					return;
				}
				box.innerHTML = '';
				ads.forEach(function (ad) {
				var row = document.createElement('div');
				row.className = 'ad-row';
				row.draggable = true;
				row.dataset.id = ad.id;
				var handle = document.createElement('span');
				handle.className = 'ad-handle';
				handle.title = '拖动排序';
				handle.textContent = '⠿';
				row.appendChild(handle);
					var thumb;
					if (ad.html) {
						thumb = document.createElement('div');
						thumb.className = 'ad-thumb code';
						thumb.textContent = '代码';
					} else {
						thumb = document.createElement('img');
						thumb.className = 'ad-thumb';
						thumb.src = ad.image_url;
						thumb.alt = '';
						thumb.onerror = function () { thumb.style.visibility = 'hidden'; };
					}
					var info = document.createElement('div');
					info.className = 'ad-info';
					var state = ad.enabled
						? '<span class="state on">展示中</span>'
						: '<span class="state off">已停用</span>';
					info.innerHTML =
						'<div class="ad-name">' + esc(ad.name) + ' ' + state + '</div>' +
						'<div class="ad-link">' + (ad.html ? '广告代码投放' : esc(ad.link_url || '（无跳转链接）')) + '</div>';
					var actions = document.createElement('div');
					actions.className = 'ad-actions';
					var btnEdit = document.createElement('button');
					btnEdit.className = 'btn ghost sm';
					btnEdit.textContent = '编辑';
					btnEdit.addEventListener('click', function () { startEdit(ad); });
					var btnToggle = document.createElement('button');
					btnToggle.className = 'btn ghost sm';
					btnToggle.textContent = ad.enabled ? '停用' : '启用';
					btnToggle.addEventListener('click', function () {
						toggleAd(ad.id, ad.enabled);
					});
					var btnDel = document.createElement('button');
					btnDel.className = 'btn danger sm';
					btnDel.textContent = '删除';
					btnDel.addEventListener('click', function () {
						if (confirm('确定删除广告「' + ad.name + '」吗？')) {
							deleteAd(ad.id);
						}
					});
					actions.appendChild(btnEdit);
					actions.appendChild(btnToggle);
					actions.appendChild(btnDel);
					row.appendChild(thumb);
					row.appendChild(info);
					row.appendChild(actions);
					box.appendChild(row);
				});
			}

			function loadList() {
				fetch('/api/ads?all=1', { headers: { 'Authorization': 'Bearer ' + token } })
					.then(function (r) {
						if (r.status === 401) { logout(); throw new Error('密码已失效，请重新登录'); }
						return r.json();
					})
					.then(function (data) { renderList(data.ads || []); })
					.catch(function (e) { toast(e.message || '加载失败', true); });
			}

			/* ===== 访问统计 ===== */
			var PAGE_NAMES = { home: '主页', editor: '编辑器', admin: '后台' };
			var DEVICE_NAMES = { mobile: '📱 移动端', desktop: '💻 桌面端' };

			function fmtNum(n) {
				return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(n);
			}

			function loadStats() {
				fetch('/api/stats', { headers: { 'Authorization': 'Bearer ' + token } })
					.then(function (r) {
						if (r.status === 401) { logout(); throw new Error('密码已失效，请重新登录'); }
						return r.json();
					})
					.then(function (s) { renderStats(s); })
					.catch(function (e) { toast(e.message || '统计加载失败', true); });
			}

			function tile(label, num) {
				return '<div class="tile"><div class="t-num">' + fmtNum(num) + '</div><div class="t-label">' + label + '</div></div>';
			}

			function hbars(elId, rows, labelOf) {
				var el = $(elId);
				if (!rows.length) {
					el.innerHTML = '<p class="muted">暂无数据</p>';
					return;
				}
				var max = 1;
				rows.forEach(function (r) { if (r.pv > max) max = r.pv; });
				el.innerHTML = rows.map(function (r) {
					var w = Math.max(4, Math.round(r.pv / max * 100));
					return '<div class="hbar-row"><span class="h-label" title="' + esc(labelOf(r)) + '">' + esc(labelOf(r)) +
						'</span><span class="h-track"><span class="h-fill" style="width:' + w + '%"></span></span>' +
						'<span class="h-val">' + fmtNum(r.pv) + '</span></div>';
				}).join('');
			}

			function renderStats(s) {
				$('stat-tiles').innerHTML =
					tile('今日浏览 PV', s.today.pv) + tile('今日访客 UV', s.today.uv) +
					tile('昨日 PV', s.yesterday.pv) + tile('昨日 UV', s.yesterday.uv) +
					tile('本月 PV', s.month.pv) + tile('累计 PV', s.total.pv);

				var max = 1;
				s.trend.forEach(function (d) { if (d.pv > max) max = d.pv; });
				$('trend-chart').innerHTML = s.trend.map(function (d) {
					var pvH = Math.max(2, Math.round(d.pv / max * 100));
					var uvH = Math.max(2, Math.round(d.uv / max * 100));
					return '<div class="day-col"><div class="bars">' +
						'<span class="bar" data-v="' + d.label + ' PV ' + d.pv + ' · UV ' + d.uv + '" style="height:' + pvH + '%"></span>' +
						'<span class="bar uv" data-v="' + d.label + ' PV ' + d.pv + ' · UV ' + d.uv + '" style="height:' + uvH + '%"></span>' +
						'</div><div class="day-label">' + d.label + '</div></div>';
				}).join('');

				hbars('stat-pages', s.pages, function (r) { return PAGE_NAMES[r.page] || r.page; });
				hbars('stat-refs', s.refs, function (r) { return r.ref_host; });
				hbars('stat-devices', s.devices, function (r) { return DEVICE_NAMES[r.device] || r.device || '未知'; });
			}

			$('btn-stats-refresh').addEventListener('click', loadStats);

			/* ===== 拖拽排序 ===== */
			var dragRow = null;

			$('ad-list').addEventListener('dragstart', function (e) {
				var row = e.target.closest ? e.target.closest('.ad-row') : null;
				if (!row) return;
				dragRow = row;
				row.classList.add('dragging');
				if (e.dataTransfer) {
					e.dataTransfer.effectAllowed = 'move';
					try { e.dataTransfer.setData('text/plain', row.dataset.id); } catch (err) { /* 忽略 */ }
				}
			});
			$('ad-list').addEventListener('dragover', function (e) {
				e.preventDefault();
				if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
				if (!dragRow) return;
				var over = e.target.closest ? e.target.closest('.ad-row') : null;
				if (!over || over === dragRow) return;
				var rect = over.getBoundingClientRect();
				var before = (e.clientY - rect.top) < rect.height / 2;
				var list = $('ad-list');
				if (before) {
					list.insertBefore(dragRow, over);
				} else {
					list.insertBefore(dragRow, over.nextSibling);
				}
			});
			$('ad-list').addEventListener('drop', function (e) { e.preventDefault(); });
			$('ad-list').addEventListener('dragend', function () {
				if (!dragRow) return;
				dragRow.classList.remove('dragging');
				dragRow = null;
				saveOrder();
			});

			function saveOrder() {
				var ids = Array.prototype.map.call(document.querySelectorAll('#ad-list .ad-row'), function (r) {
					return Number(r.dataset.id);
				});
				if (!ids.length) return;
				fetch('/api/ads/order', { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ ids: ids }) })
					.then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
					.then(function (res) {
						if (!res.ok) throw new Error(res.d.error || '保存失败');
						toast('排序已保存');
					})
					.catch(function (e) { toast(e.message, true); loadList(); });
			}

			function toggleAd(id, enabled) {
				fetch('/api/ads?id=' + id, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ enabled: !enabled }) })
					.then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
					.then(function (res) {
						if (!res.ok) throw new Error(res.d.error || '操作失败');
						toast(res.d.enabled ? '已启用' : '已停用');
						loadList();
					})
					.catch(function (e) { toast(e.message, true); });
			}

			/* ===== 编辑广告 ===== */
			var editingId = null;

			function startEdit(ad) {
				editingId = ad.id;
				if (ad.html) {
					setTab('code');
					$('f-html').value = ad.html;
				} else {
					setTab('image');
					$('f-image').value = ad.image_url || '';
					$('f-link').value = ad.link_url || '';
					if (/^https?:\/\//i.test(ad.image_url || '')) {
						$('img-preview').src = ad.image_url;
						$('img-preview').style.display = 'inline-block';
					}
				}
				$('f-name').value = ad.name;
				$('form-title').textContent = '编辑广告 #' + ad.id;
				$('btn-add').textContent = '保存修改';
				$('btn-cancel-edit').hidden = false;
				$('add-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
			}

			function resetForm() {
				editingId = null;
				$('f-name').value = '';
				$('f-image').value = '';
				$('f-link').value = '';
				$('f-html').value = '';
				$('img-preview').style.display = 'none';
				$('form-title').textContent = '添加广告';
				$('btn-add').textContent = '添加广告';
				$('btn-cancel-edit').hidden = true;
			}

			function deleteAd(id) {
				fetch('/api/ads?id=' + id, { method: 'DELETE', headers: authHeaders() })
					.then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
					.then(function (res) {
						if (!res.ok) throw new Error(res.d.error || '删除失败');
						toast('已删除');
						loadList();
					})
					.catch(function (e) { toast(e.message, true); });
			}

			function login(pw, remember) {
				token = pw;
				fetch('/api/ads?all=1', { headers: { 'Authorization': 'Bearer ' + token } })
					.then(function (r) {
						if (r.status === 401) throw new Error('管理密码错误');
						return r.json();
					})
					.then(function (data) {
						if (remember) localStorage.setItem(PW_KEY, token);
						$('gate').hidden = true;
						$('panel').hidden = false;
						renderList(data.ads || []);
						loadStats();
					})
					.catch(function (e) {
						token = '';
						$('gate-msg').textContent = e.message || '登录失败';
					});
			}

			$('btn-login').addEventListener('click', function () { login($('pw').value.trim(), true); });
			$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login($('pw').value.trim(), true); });

			// 类型切换
			function setTab(type) {
				adType = type;
				$('tab-image').classList.toggle('on', type === 'image');
				$('tab-code').classList.toggle('on', type === 'code');
				$('fields-image').hidden = type !== 'image';
				$('fields-code').hidden = type !== 'code';
			}
			$('tab-image').addEventListener('click', function () { setTab('image'); });
			$('tab-code').addEventListener('click', function () { setTab('code'); });

			// 图片预览
			$('f-image').addEventListener('change', function () {
				var v = $('f-image').value.trim();
				var p = $('img-preview');
				if (/^https:\/\//i.test(v) || /^http:\/\//i.test(v)) {
					p.src = v; p.style.display = 'inline-block';
				} else {
					p.style.display = 'none';
				}
			});

			/* ===== 图片直传（R2） ===== */
			function setUploadBusy(busy) {
				var btn = $('btn-upload');
				btn.disabled = busy;
				btn.textContent = busy ? '上传中…' : '📁 上传图片文件';
			}

			async function prepareImage(file) {
				if (file.type === 'image/gif') {
					return file; // GIF 使用原文件，保留动画
				}
				var img = await new Promise(function (resolve, reject) {
					var i = new Image();
					i.onload = function () { resolve(i); };
					i.onerror = function () { reject(new Error('图片读取失败')); };
					i.src = URL.createObjectURL(file);
				});
				var maxW = 1600;
				var w = img.width, h = img.height;
				if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
				var c = document.createElement('canvas');
				c.width = w; c.height = h;
				c.getContext('2d').drawImage(img, 0, 0, w, h);
				var type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
				var blob = await new Promise(function (res) { c.toBlob(res, type, 0.9); });
				URL.revokeObjectURL(img.src);
				return (blob && blob.size < file.size) ? blob : file;
			}

			$('btn-upload').addEventListener('click', function () { $('f-file').click(); });
			$('f-file').addEventListener('change', async function () {
				var file = this.files[0];
				this.value = '';
				if (!file) return;
				if (!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)) { toast('仅支持 PNG / JPEG / WebP / GIF 图片', true); return; }
				if (file.size > 5 * 1024 * 1024) { toast('图片不能超过 5MB', true); return; }
				if (!token) { toast('请先登录', true); return; }
				setUploadBusy(true);
				try {
					var blob = await prepareImage(file);
					var res = await fetch('/api/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': blob.type }, body: blob });
					var d = await res.json();
					if (!res.ok) throw new Error(d.error || '上传失败');
					$('f-image').value = d.url;
					$('img-preview').src = d.url;
					$('img-preview').style.display = 'inline-block';
					toast('图片已上传');
				} catch (e) {
					toast(e.message || '上传失败', true);
				} finally {
					setUploadBusy(false);
				}
			});

			$('btn-add').addEventListener('click', function () {
				var btn = $('btn-add');
				var payload = { name: $('f-name').value.trim() };
				if (adType === 'image') {
					payload.image_url = $('f-image').value.trim();
					payload.link_url = $('f-link').value.trim();
				} else {
					payload.html = $('f-html').value;
				}
				if (!payload.name) { toast('请填写广告名称', true); return; }
				var wasEditing = editingId;
				btn.disabled = true;
				var req = wasEditing
					? fetch('/api/ads?id=' + wasEditing, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload) })
					: fetch('/api/ads', { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
				req.then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
					.then(function (res) {
						btn.disabled = false;
						if (!res.ok) throw new Error(res.d.error || (wasEditing ? '保存失败' : '添加失败'));
						toast(wasEditing ? '广告已更新' : '广告已添加');
						resetForm();
						loadList();
					})
					.catch(function (e) { btn.disabled = false; toast(e.message, true); });
			});

			// 自动登录尝试
			if (token) {
				login(token, true);
			}
		})();
	</script>
</body>
</html>
